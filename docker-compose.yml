# 只起中间件：Redis / Neo4j / Milvus（含 etcd + minio）/ Elasticsearch
# Python 代码仍用 Conda 跑，见 README「本地运行」。
#
#   docker compose up -d             启动全部
#   docker compose ps                看健康状态
#   docker compose logs -f milvus    看某个服务日志
#   docker compose down              停止（数据保留在 named volumes）
#   docker compose down -v           停止并删除数据
#
# 端口与 config/settings.py 的默认值一一对应，宿主机 localhost 直连即可，
# 不需要改 deploy/.env 里的地址。
#
# 内存：四个中间件全开约需 4–6 GB。只调试某一块时，可单独启动，例如：
#   docker compose up -d redis neo4j

name: zhixueban

services:
  # settings: REDIS_HOST=localhost REDIS_PORT=6379 REDIS_PASSWORD=(空)
  redis:
    image: redis:7-alpine
    container_name: zhixueban-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # settings: NEO4J_URI=bolt://localhost:7687 NEO4J_USER=neo4j NEO4J_PASSWORD=password
  # 默认密码与 settings.py 保持一致，开箱即连；上生产务必改强密码并同步 deploy/.env。
  neo4j:
    image: neo4j:5-community
    container_name: zhixueban-neo4j
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-password}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-password}' 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  # Milvus standalone 需要 etcd（元数据）+ minio（对象存储），三个一起起。
  # settings: MILVUS_URI=http://127.0.0.1:19530 MILVUS_COLLECTION=zhixueban_chunks MILVUS_DIM=1024
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: zhixueban-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # 2025 版 minio 只认 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD，旧变量已移除
  minio:
    image: registry.cncfstack.com/quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: zhixueban-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: zhixueban-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"   # gRPC，MILVUS_URI 指向这里
      - "9091:9091"     # 健康检查 / 监控
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      start_period: 90s
      retries: 5
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # settings: ES_URL=http://127.0.0.1:9200 ES_USER=(空) ES_PASSWORD=(空)
  # 单节点 + 关闭安全认证，与 settings 默认的空账号匹配。
  # 注意：官方镜像不含 IK 中文分词；production/es_bm25.py 会自动回落到 standard，
  # 日志里出现「ES 无 IK 分词」属正常。要中文分词请自行做带 analysis-ik 的镜像。
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: zhixueban-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
  etcd_data:
  minio_data:
  milvus_data:
  es_data:
